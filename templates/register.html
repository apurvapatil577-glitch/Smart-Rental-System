<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | RentNest</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-body">


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🏠 RentNest
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/">Properties</a>

            <a href="/">About</a>

            <a href="/">Contact</a>

            <a href="/register"
             class="register-btn">

             Register

            </a>

        </div>

    </nav>



    <!-- Register Section -->

    <section class="auth-section">


        <div class="auth-image">

            <div class="auth-overlay">

                <p>WELCOME TO RENTNEST</p>

                <h1>
                    Find a place
                    you can call home.
                </h1>

                <span>
                    Join RentNest and discover
                    rental properties easily.
                </span>

            </div>

        </div>



        <div class="auth-form">

            <div class="form-heading">

                <p class="small-heading">
                    CREATE ACCOUNT
                </p>

                <h2>
                    Get Started
                </h2>

                <p>
                    Create your RentNest account
                    to continue.
                </p>

            </div>


            <form method="POST"
                  action="/register">


                <!-- Name -->

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required>



                <!-- Email -->

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>



                <!-- Password -->

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>



                <!-- Role -->

                <label>
                    Register As
                </label>

                <select
                    name="role"
                    required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="Tenant">
                        👤 Tenant
                    </option>

                    <option value="Owner">
                        🏠 Property Owner
                    </option>

                </select>



                <!-- Button -->

                <button
                    type="submit"
                    class="auth-submit">

                    Create Account

                </button>


            </form>


            <p class="account-text">

                Already have an account?
            <a href="/register" class="register-btn">
                Register
            </a>   

            </p>


        </div>

    </section>


</body>

</html>
