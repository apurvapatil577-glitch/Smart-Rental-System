<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Property | RentNest</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-body">


<nav class="navbar">

    <div class="logo">
        🏠 RentNest
    </div>

    <div class="nav-links">

        <a href="/owner-dashboard">
            Dashboard
        </a>

        <a href="/owner-properties">
            My Properties
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


<section class="auth-container">

    <div class="auth-card">

        <h1>
            🏠 Add New Property
        </h1>

        <p>
            Add your rental property details.
        </p>


        <form method="POST"
              enctype="multipart/form-data">


            <label>
                Property Name
            </label>

            <input
                type="text"
                name="title"
                placeholder="Example: Beautiful 2 BHK Flat"
                required
            >


            <label>
                Property Type
            </label>

            <select name="property_type" required>

                <option value="">
                    Select Property Type
                </option>

                <option value="1 BHK">
                    1 BHK
                </option>

                <option value="2 BHK">
                    2 BHK
                </option>

                <option value="3 BHK">
                    3 BHK
                </option>

                <option value="Room">
                    Room
                </option>

                <option value="PG">
                    PG
                </option>

            </select>


            <label>
                Location
            </label>

            <input
                type="text"
                name="location"
                placeholder="Example: Pune"
                required
            >


            <label>
                Monthly Rent
            </label>

            <input
                type="number"
                name="rent"
                placeholder="Example: 10000"
                required
            >


            <label>
                Deposit
            </label>

            <input
                type="number"
                name="deposit"
                placeholder="Example: 30000"
            >


            <label>
                Facilities
            </label>

            <input
                type="text"
                name="facilities"
                placeholder="Parking, Wi-Fi, Lift"
            >


            <label>
                Property Image
            </label>

            <input
                type="file"
                name="image"
                accept="image/*"
                required
            >


            <button
                type="submit"
                class="card-button">

                Add Property

            </button>

        </form>

    </div>

</section>


</body>

</html>
